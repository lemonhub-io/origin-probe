name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-13,         target: x86_64-apple-darwin }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc, zip: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.target }}/release/origin-probe"
          strip "$bin"
          tar czf "origin-probe-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" origin-probe
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive "target/${{ matrix.target }}/release/origin-probe.exe" "origin-probe-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: origin-probe-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum origin-probe-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
